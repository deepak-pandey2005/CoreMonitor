# CoreMonitor Configuration File

network:
  interface: "wlan0"       # Active Wi-Fi or Ethernet interface
  bpf_filter: ""          # Optional Berkeley Packet Filter (e.g., "tcp", "not port 22")
  promiscuous: true
  snaplen: 65535

storage:
  pcap_enabled: true      # Export raw traffic captures into standard .pcap files
  pcap_dir: "captures"
  pcap_rotate_seconds: 3600
  csv_enabled: true       # Export parsed packet metadata to CSV files
  csv_dir: "captures"
  csv_rotate_seconds: 3600

influxdb:
  enabled: true           # Export metrics to InfluxDB for Grafana visualization
  url: "http://localhost:8086"
  token: "coremonitor-super-secret-auth-token"
  org: "coremonitor-org"
  bucket: "network_metrics"
  batch_size: 50
  flush_interval_seconds: 2

ids:
  enabled: true
  port_scan_threshold: 15          # Max distinct ports hit within window before alert
  port_scan_window_seconds: 10
  syn_flood_threshold: 100         # SYN packets per second from a single host
  syn_flood_window_seconds: 2
  bandwidth_spike_bytes_per_sec: 10000000  # 10 MB/s per IP
  bandwidth_window_seconds: 2
  dns_tunnel_anomaly_length: 60    # Flag DNS queries with subdomain length exceeding this

ips:
  enabled: true                    # Enable Active Defense (IPS)
  mode: "simulate"                 # "simulate" (safe logging) or "block" (executes real iptables DROP rules)
  ban_duration_seconds: 600        # Automatic ban duration (10 minutes)
  min_severity: "HIGH"             # Minimum severity to trigger ban ("HIGH" or "CRITICAL")
  whitelist:                       # IPs that will NEVER be banned (protects gateways & management)
    - "127.0.0.1"
    - "::1"
    - "192.168.1.1"
    - "192.168.0.1"

flow:
  enabled: true                    # Aggregate 5-tuple bidirectional network conversation flows
  idle_timeout_seconds: 30         # Evict flows idle for 30s
  active_timeout_seconds: 120      # Maximum active flow duration before emission

webhook:
  enabled: false                   # Push real-time alert notifications to Discord / Slack / Telegram
  discord_url: ""                  # e.g. "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL"
  slack_url: ""                    # e.g. "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  telegram_bot_token: ""           # e.g. "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
  telegram_chat_id: ""             # e.g. "-100123456789"
  min_severity: "HIGH"             # "HIGH" or "CRITICAL"
  cooldown_seconds: 30             # Suppress repetitive webhook notifications per (IP, threat_type)

siem:
  enabled: false                   # Stream alerts in CEF / Syslog to SIEM (Splunk, Wazuh, Elastic)
  format: "cef"                    # "cef" (ArcSight/Splunk), "syslog-cef" (RFC 3164 with CEF), or "rfc5424"
  transport: "udp"                 # "udp", "tcp", or "file"
  address: "127.0.0.1:514"         # SIEM host:port (for udp/tcp)
  file_path: "captures/siem.log"   # Destination log file (when transport is "file")
  facility: 16                     # Syslog facility (16 = local0, 4 = auth)
  min_severity: "LOW"              # Minimum alert severity: "LOW", "MEDIUM", "HIGH", "CRITICAL"

prometheus:
  enabled: true                    # Expose native Prometheus scraping endpoint (/metrics)
  listen_addr: "0.0.0.0:2112"      # Standard exporter port
  endpoint: "/metrics"             # Metrics path

live_dashboard: true     # Render real-time terminal UI with statistics and alerts
